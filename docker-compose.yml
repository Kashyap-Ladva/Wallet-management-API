services:
  db:
    image: postgres:16-alpine
    container_name: wallet_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wallet_net

  redis:
    image: redis:7-alpine
    container_name: wallet_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data
    networks:
      - wallet_net

  api:
    build: .
    container_name: wallet_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED}
      LOG_LEVEL: ${LOG_LEVEL}
      FILE_STORAGE_PATH: ${FILE_STORAGE_PATH}
      ANALYTICS_DAILY_CACHE_TTL: ${ANALYTICS_DAILY_CACHE_TTL}
      ANALYTICS_MONTHLY_CACHE_TTL: ${ANALYTICS_MONTHLY_CACHE_TTL}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN}
      RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER}
      RATE_LIMIT_READ: ${RATE_LIMIT_READ}
      RATE_LIMIT_WRITE: ${RATE_LIMIT_WRITE}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN}
    volumes:
      - shared_data:/app/data
    networks:
      - wallet_net

  celery_worker:
    build: .
    container_name: wallet_worker
    restart: unless-stopped
    command: celery -A app.celery_app.celery_app worker --loglevel=${LOG_LEVEL} -c ${CELERY_WORKER_CONCURRENCY} -Q default,imports,scheduled,notifications
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping --timeout=10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT}
      CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT}
      CELERY_RESULT_EXPIRES: ${CELERY_RESULT_EXPIRES}
      LOG_LEVEL: ${LOG_LEVEL}
      FILE_STORAGE_PATH: ${FILE_STORAGE_PATH}
    stop_signal: SIGTERM
    volumes:
      - shared_data:/app/data
    networks:
      - wallet_net

  celery_beat:
    build: .
    container_name: wallet_beat
    restart: unless-stopped
    command: celery -A app.celery_app.celery_app beat --loglevel=${LOG_LEVEL}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1, 0)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT}
      CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT}
      CELERY_RESULT_EXPIRES: ${CELERY_RESULT_EXPIRES}
      LOG_LEVEL: ${LOG_LEVEL}
      FILE_STORAGE_PATH: ${FILE_STORAGE_PATH}
    stop_signal: SIGTERM
    volumes:
      - shared_data:/app/data
    networks:
      - wallet_net

  flower:
    build: .
    container_name: wallet_flower
    restart: unless-stopped
    command: >
      celery -A app.celery_app.celery_app flower
      --address=0.0.0.0
      --port=5555
      --basic_auth=${FLOWER_BASIC_AUTH}    
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5555/healthcheck >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    networks:
      - wallet_net

volumes:
  postgres_data:
  redis_data:
  shared_data:

networks:
  wallet_net:
    driver: bridge
